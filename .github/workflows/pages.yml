name: Deploy system design book to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.160.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.23.3
          cache-dependency-path: system-design-web/go.sum

      - name: Install Hugo Extended
        shell: bash
        run: |
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          url="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          mkdir -p "${RUNNER_TEMP}/hugo"
          curl --fail --location --silent --show-error "${url}" --output "${RUNNER_TEMP}/${archive}"
          echo "133adf4932c1b626b6fe6aa28d56791555abe3ceff167e03be534e8324c9ed39  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Download pinned Hugo Module
        working-directory: system-design-web
        run: |
          go mod download github.com/pgsty/oink@v0.6.0
          hugo mod verify

      - name: Synchronize translated content
        working-directory: system-design-web
        run: python3 scripts/sync_content.py

      - name: Validate generated content
        working-directory: system-design-web
        run: python3 scripts/check_site.py

      - name: Build with the Pages base URL
        working-directory: system-design-web
        run: >-
          hugo
          --baseURL "${{ steps.pages.outputs.base_url }}/"
          --destination public
          --gc
          --minify
          --printPathWarnings
          --panicOnWarning

      - name: Validate rendered site links
        working-directory: system-design-web
        run: python3 scripts/check_site.py --public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: system-design-web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
